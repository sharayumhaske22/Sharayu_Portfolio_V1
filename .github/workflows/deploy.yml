
name: Deploy Angular Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular portfolio
        run: >
          npx ng build Sharayu_Portfolio_V1
          --configuration production
          --base-href "/${{ github.event.repository.name }}/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Add SPA fallback
        run: |
          cp dist/Sharayu_Portfolio_V1/browser/index.html \
             dist/Sharayu_Portfolio_V1/browser/404.html

      - name: Upload build files
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/Sharayu_Portfolio_V1/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4
